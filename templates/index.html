<!DOCTYPE html>
<html>
    <head>
        <title>Image Search</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body class="container mt-5">
        <h2>Setup</h2>
        <form method="POST">
            <div class="mb-3">
                <label>Select Set</label>
                <select name="selected_set" class="form-control">
                    <option value="set1">Set 1</option>
                    <option value="set2">Set 2</option>
                </select>
            </div>

            <div class ="mb-3">
                <label>Display Duration (Seconds per photo)</label>
                <input type="number" name="duration" class="form-control" min="1" required>
            </div>

            <div class="mb-3">
                <div class="form-check">
                    <input type="checkbox" name="automation" value="true" class="form-check-input" id="automation">
                    <label class="form-check-label" for="automation">Show Automation Suggestion</label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Continue</button>
    

        </form>
    </body>
</html>
