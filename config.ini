[paths]
trustworthy_folder = static/images/trustworthy
untrustworthy_folder = static/images/untrustworthy
baseline_folder = static/images/baseline
questions_file = text.json
upload_folder = uploads
[settings]
# Display duration in seconds per photo
duration = 8
# Default image set to show (set1, set2, etc)
default_set = set1
# Enable automation suggestions (true/false)
automation = true

# Whisper model size: tiny, base, small, medium, large
whisper_model = tiny

# Whisper device: cpu or cuda
whisper_device = cpu

# Time user has to speak their answer in seconds
recording_duration = 5
# Countdown timer after showing feedback in seconds
feedback_countdown = 3
# Time delay before automation answer popup appears in seconds
# (automation popup shows at this delay, microphone modal shows after full duration)
automation_popup_delay = 5
[image_sets]
# Image sets - JSON format with list of filenames
set1 = ["baseline/GreenSemi.png", "baseline/OrangeCar.png", "reliable/PurpleJeep.png", "reliable/YellowCar.png", "reliable/RedCar.png", "unreliable/PurpleJeep.png", "unreliable/GreenCar.png", "reliable/RedCar2.png", "reliable/YellowSemi2.png", "reliable/OrangeSemi.png"]
set2 = ["BlueCar_Baseline.png", "OrangeSemi_Baseline.png", "RedCar_Baseline.png", "YellowCar_Baseline.png", "GreenCar_Reliable.png", "BlueCar_Reliable.png", "YellowCar_Reliable.png", "RedTruck_Reliable.png", "RedCar_Reliable.png"]